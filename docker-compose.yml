services:
  web:
    build: .
    container_name: web-app-compose
    ports:
      - "5000:5000"
    networks:
      - web-network
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: nginx-compose
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - web-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: flaskdb
      MYSQL_USER: flaskuser
      MYSQL_PASSWORD: flaskpassword
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - web-network
networks:
  web-network:
volumes:
  mysql-data:


